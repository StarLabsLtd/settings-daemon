name: CI

on:
  push:
    branches: [master]
  pull_request:
    types:
      - opened
      - reopened
      - synchronize

jobs:
  build:
    runs-on: ubuntu-latest

    container:
      image: ghcr.io/elementary/docker:development-target

    steps:
    - uses: actions/checkout@v7
    - name: Install Dependencies
      run: |
        apt update
        apt install -y libaccountsservice-dev libdbus-1-dev libgranite-7-dev libgeoclue-2-dev libfwupd-dev libpackagekit-glib2-dev libgdk-pixbuf-2.0-dev libgexiv2-dev libgtk-4-dev meson systemd-dev valac libpulse-dev libwireplumber-0.5-dev xauth xvfb
    - name: Build
      env:
        DESTDIR: out
      run: |
        meson build
        ninja -C build
        ninja -C build install
        meson test -C build --print-errorlogs

  lint:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7
    - uses: elementary/actions/vala-lint@main
